# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx3G
# parallel builds race the :common @ExpectPlatform transforms (transformProductionFabric vs NeoForge) — one platform jar ends up with the other platform's PlatformImpl stub
org.gradle.parallel=false

# Mod properties
mod_version=1.1.0.001
maven_group = net.rpg_foundation
archives_name = armor_model_api
enabled_platforms = fabric,neoforge

# Minecraft properties
minecraft_version = 26.3
# Game versions this build is released for: colon separated, oldest first; the first one is the manifest minimum.
#   single: minecraft_compat_versions=26.3     multiple: minecraft_compat_versions=1.21:1.21.1
minecraft_compat_versions=26.3

# Dependencies
fabric_loader_version = 0.19.5
fabric_api_version = 0.160.6+26.3
neoforge_version = 26.3.0.3-beta
iris_version = 1.11.6+26.3
# TODO 26.3: Iris ships no NeoForge build for 26.3 yet (checked 2026-09-16). The NeoForge module only needs
# the loader-agnostic `net.irisshaders.iris.api.v0` package at compile time (unchanged since 1.10), so it
# keeps the last NeoForge jar until one exists; then fold this back into iris_version.
iris_neoforge_version = 1.11.2+26.2
