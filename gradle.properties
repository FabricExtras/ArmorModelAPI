# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx3G
# parallel builds race the :common @ExpectPlatform transforms (transformProductionFabric vs NeoForge) — one platform jar ends up with the other platform's PlatformImpl stub
org.gradle.parallel=false

# Mod properties
mod_version=1.0.3.001
maven_group = net.rpg_foundation
archives_name = armor_model_api
enabled_platforms = fabric,neoforge

# Minecraft properties
minecraft_version = 26.1.2
# Game versions this build is released for: colon separated, oldest first; the first one is the manifest minimum.
#   single: minecraft_compat_versions=26.1:26.1.1:26.1.2     multiple: minecraft_compat_versions=1.21:1.21.1
minecraft_compat_versions=26.1:26.1.1:26.1.2

# Dependencies
fabric_loader_version = 0.19.3
fabric_api_version = 0.155.2+26.1.2
neoforge_version = 26.1.2.94
iris_version = 1.10.9+26.1
