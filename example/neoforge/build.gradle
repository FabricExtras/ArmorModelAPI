plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

// Subprojects configure alphabetically (example-* before neoforge), so force the API project
// to configure first before referencing its shadowJar task. Inside dependencies{}
// `project(...)` is a dependency notation, hence the resolution out here.
evaluationDependsOn(':neoforge')
def apiShadowJar = rootProject.project(':neoforge').tasks.named('shadowJar')

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    common(project(path: ':example-common')) { transitive = false }
    shadowBundle project(path: ':example-common', configuration: 'transformProductionNeoForge')

    // Compile against the API (compileOnly: see example/common/build.gradle)...
    compileOnly(project(path: ':common')) { transitive = false }

    // ...and RUN with the API as a real, self-contained mod via its shadow jar.
    localRuntime files(apiShadowJar.flatMap { it.archiveFile })
}

tasks.named('runClient') { dependsOn apiShadowJar }

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

// No remapJar on 26.1+: the shaded jar is the mod jar.
jar {
    archiveClassifier = 'dev'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
}

assemble.dependsOn shadowJar

// Dev-only module — never publish.
tasks.withType(AbstractPublishToMaven).configureEach { enabled = false }
