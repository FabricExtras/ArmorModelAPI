plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

// Subprojects configure alphabetically (example-* before fabric), so force the API project
// to configure first before referencing its shadowJar task. Inside dependencies{}
// `project(...)` is a dependency notation, hence the resolution out here.
evaluationDependsOn(':fabric')
def apiShadowJar = rootProject.project(':fabric').tasks.named('shadowJar')

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    common(project(path: ':example-common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':example-common', configuration: 'transformProductionFabric')

    // Compile against the API (compileOnly: see example/common/build.gradle)...
    compileOnly(project(path: ':common', configuration: 'namedElements')) { transitive = false }

    // ...and RUN with the API as a real, self-contained mod: the dev-shadow jar bundles
    // :common into :fabric (fabric.mod.json + access widener + classes in one classpath
    // entry, which is what the dev mod discovery needs).
    localRuntime files(apiShadowJar.flatMap { it.archiveFile })
}

tasks.named('runClient') { dependsOn apiShadowJar }

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

// Dev-only module — never publish (maven-publish; the mod-publish-plugin is not applied here).
tasks.withType(AbstractPublishToMaven).configureEach { enabled = false }
